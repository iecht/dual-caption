<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Dual Caption dev page</title>
  <style>
    body { margin: 0; background: #111; color: #ccc; font: 13px -apple-system, sans-serif; }
    .player { position: relative; width: 100vw; height: 100vh; display: grid; place-items: center; }
    video { width: 100%; height: 100%; background: #000; }
    .bar { position: fixed; top: 8px; left: 8px; z-index: 1; display: flex; gap: 6px; }
  </style>
  <!-- Load order mirrors manifest.json content_scripts -->
  <script src="chrome-stub.js"></script>
  <script src="../src/parser.js"></script>
  <script src="../src/plex.js"></script>
  <script src="../src/overlay-css.js"></script>
  <script src="../src/content.js"></script>
</head>
<body>
  <div class="bar">
    <button id="load">加载示例字幕</button>
  </div>
  <div class="player" id="player">
    <video id="v" controls muted playsinline></video>
  </div>
  <script>
    // ?video=<url> — defaults to a clip served next to the extension folder
    const params = new URLSearchParams(location.search);
    document.getElementById('v').src = params.get('video') || '/clip.mp4';
    async function loadSamples() {
      for (const [slot, f] of [['primary', 'S01E01.ja.srt'], ['secondary', 'S01E01.zh.srt']]) {
        const text = await (await fetch('../samples/' + f)).text();
        DC.app.loadText(slot, f, text);
      }
    }
    document.getElementById('load').onclick = loadSamples;
    if (params.has('autoload')) setTimeout(loadSamples, 1500);
  </script>
</body>
</html>
